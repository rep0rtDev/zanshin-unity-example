name: ci
on: [push, pull_request]
jobs:
  stack:
    name: compose up + Nakama RPC smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d
      - name: wait for provisioning
        run: |
          for i in $(seq 1 60); do
            state=$(docker compose ps -a --format json provision | python3 -c 'import sys,json; d=[json.loads(l) for l in sys.stdin if l.strip()]; print(d[0]["State"] if d else "")')
            [ "$state" = "exited" ] && break; sleep 3
          done
          docker compose logs provision
          [ "$(docker compose ps -a --format json provision | python3 -c 'import sys,json; print(json.loads(sys.stdin.readline())["ExitCode"])')" = "0" ]
      - run: ./scripts/smoke.sh
      - if: failure()
        run: docker compose logs zanshin nakama
