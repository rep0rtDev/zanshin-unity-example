name: ci
on: [push, pull_request]
jobs:
  stack:
    name: compose up + Nakama RPC smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d
      - name: wait for provisioning
        run: |
          for i in $(seq 1 90); do
            code=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' "$(docker compose ps -aq provision)")
            case "$code" in exited*) break;; esac
            sleep 3
          done
          docker compose logs provision
          [ "$code" = "exited 0" ] || { echo "provision did not finish: $code"; docker compose logs zanshin; exit 1; }
      - run: ./scripts/smoke.sh
      - if: failure()
        run: docker compose logs zanshin nakama
